name: Release

# A release is published when its notes land on main (docs/releases/vX.Y.Z.md), or when a vX.Y.Z tag is pushed.
on:
  push:
    branches: [main]
    paths: ["docs/releases/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the version
        id: v
        run: echo "tag=v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: repo2video ${{ steps.v.outputs.tag }}
          body_path: docs/releases/${{ steps.v.outputs.tag }}.md
          make_latest: true
          files: |
            site/media/trailer.mp4
            site/media/metro.mp4
            site/media/quest.mp4
            site/media/news.mp4
            site/media/reel.mp4
            site/media/commander-onboarding.mp4
            site/media/autoresearch-trailer.mp4
            site/media/pronunciation.m4a
